<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAT Trainer — full-length practice tests</title>
<meta name="description" content="Full Digital SAT practice: 60 test forms, Reading & Writing and Math, adaptive modules, Desmos built in, scored 400-1600 with a diagnostic on every miss." />
<link rel="stylesheet" href="vendor/katex.min.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="styles2.css" />
<link rel="stylesheet" href="styles3.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='18' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <a class="brand" href="#/" id="brand">
        <span class="brand-mark">∑</span>
        <span class="brand-text">SAT<span class="brand-dim">Trainer</span></span>
      </a>
      <span class="crumb" id="crumb"></span>
    </div>
    <div class="topbar-center" id="timerSlot"></div>
    <div class="topbar-right" id="tools">
      <button class="acct-chip" id="acctChip" title="Account">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.8 20c.7-3.6 3.7-5.6 7.2-5.6s6.5 2 7.2 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Guest</span>
      </button>
      <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.4-9.62A9 9 0 0 0 12 3Z" fill="currentColor"/></svg>
      </button>
      <button class="tool-btn" id="btnReference" title="Reference sheet (R)">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 4h11a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 8h7M8 12h7M8 16h4" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>Reference</span>
      </button>
      <button class="tool-btn primary-ghost" id="btnCalculator" title="Desmos graphing calculator (Tab)">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M2 18c4-12 6 4 9-6s5 6 11-8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span>Calculator</span>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <aside class="calc-panel" id="calcPanel" hidden>
    <div class="calc-head">
      <div class="calc-tabs">
        <button class="calc-tab active" data-calc="graph">Graphing</button>
        <button class="calc-tab" data-calc="sci">Scientific</button>
      </div>
      <button class="icon-btn" id="btnCalcClose" aria-label="Close calculator">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="calc-body">
      <div id="desmosHost" class="desmos-host"></div>
      <div id="sciHost" class="sci-host" hidden></div>
    </div>
  </aside>
  <div class="calc-resize" id="calcResize" hidden></div>

  <div class="modal-backdrop" id="refModal" hidden>
    <div class="modal ref-modal">
      <div class="modal-head">
        <h3>Reference Sheet</h3>
        <button class="icon-btn" data-close-modal aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body ref-grid" id="refBody"></div>
      <p class="ref-foot">The Digital SAT gives you these formulas on the math section. Everything else you have to know — and anything you can graph, Desmos will do faster than the algebra.</p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/katex.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/mathrender.js"></script>
  <script src="js/views.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/results.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
