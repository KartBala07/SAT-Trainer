# Fly.io — fly launch --no-deploy, then: fly secrets set GOOGLE_CLIENT_ID=...
#                                fly deploy
app = "sat-trainer"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  SAT_DATA_DIR = "/data"

[[mounts]]
  source = "sat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
